spring:
  application:
    name: dlq-healing-agent
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dlqagent}
    username: ${DB_USER:dlqagent}
    password: ${DB_PASSWORD:dlqagent}
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: dlq-healing-agent
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    listener:
      ack-mode: manual
      observation-enabled: true   # a span per consumed record, continuing the producer's trace
    template:
      observation-enabled: true   # a span per published record (the replay)
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:not-set}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.0

dlqagent:
  topics:
    partitions: 3                # for topics this service declares itself
    declare: true                # local and tests only: set false where topics are managed elsewhere
  retry:
    max-attempts: 5
    initial-delay: 2s
    multiplier: 2.0
    max-delay: 5m
    poll-interval: 5s            # how often due retries are looked for
    batch-size: 10               # most replays per wake-up, which bounds the replay rate
    breaker:
      failure-threshold: 5       # retried events that came back to the DLQ ...
      failure-window: 1m         # ... within this window open the breaker
      cooldown: 30s              # no replays at all while open
      canary-window: 2m          # after one canary replay: nothing came back this long = closed again
  planner:
    min-confidence: 0.7
    max-payload-chars: 4000      # prompt size bound; longer text is truncated
    max-stack-trace-chars: 2000
  # One entry per DLQ this service heals. A DLQ has exactly one source topic. Each stream gets its own listener,
  # circuit breaker and retry budget, so a problem in one cannot stall another.
  streams:
    - name: orders
      dlq-topic: orders-dlq
      source-topic: orders-topic
      group-id: dlq-healing-agent                        # keep: a new id would re-read the whole DLQ
      contract:
        schema: classpath:contracts/orders.schema.json   # the single source of truth for the shape of an event
        identity-fields: [orderId, customerId]           # never edited by the agent, must be unchanged in a repair
        key-field: orderId                               # must equal the Kafka key
        no-future-fields: [createdAt]                    # a timestamp the schema cannot bound
        tables: [orders]                                 # tables the model may describe for this stream
      # auto-replay: false                               # optional: every repair waits for a human
      # auto-replay-min-confidence: 0.9                  # optional per-stream override of gate.*
      # max-attempts: 5                                  # optional per-stream override of retry.max-attempts
  gate:
    auto-replay-min-confidence: 0.9   # below this, even a risk-free repair waits for a human (Tier 2)
  approval:
    username: ${APPROVAL_USERNAME:reviewer}
    password: ${APPROVAL_PASSWORD:}   # required: the app refuses to start without it

management:
  tracing:
    sampling:
      probability: 1.0            # this is a low-volume control plane; keep every trace
    baggage:
      enabled: false              # unused here, and the baggage header is producer-controlled input; off shrinks the attack surface
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        enabled: ${TRACING_EXPORT:false}   # spans are always created and linked to audit rows; shipping them is opt-in
  endpoints:
    web:
      exposure:
        include: health

logging:
  pattern:
    level: "%5p [stream=%X{stream:-}] [cid=%X{correlationId:-}] [trace=%X{traceId:-}]"
