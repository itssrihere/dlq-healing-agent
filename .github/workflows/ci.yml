# Build, tests and static analysis on every push to main and on every pull request.
# `mvn verify` runs the unit tests, the Testcontainers integration tests (Docker is available on the runner),
# and the SpotBugs + FindSecBugs gate. The opt-in live-LLM evaluation is skipped: no API key is configured here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build, test and run static analysis
        run: mvn -B verify

      - name: Keep test reports when the build fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/spotbugsXml.xml
          retention-days: 14
